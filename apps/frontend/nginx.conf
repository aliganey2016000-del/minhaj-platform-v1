# This build's index.html is shared by every domain nginx serves (the SPA
# is one static bundle) — link previews (WhatsApp, Facebook, etc.) read the
# raw HTML's <title>/og:* tags with no JavaScript execution, so the tenant-
# aware branding set at runtime via document.title in App.tsx never reaches
# them. These maps + sub_filter below rewrite the static tags per Host so a
# shared suganhub.com link unfurls as Suganhub, not the default Sahal
# Education Platform branding.
map $host $doc_title {
    default "Sahal Education Platform | منصة سهل التعليمية";
    suganhub.com "Suganhub | Where Faith, Science, and Technology Converge";
    www.suganhub.com "Suganhub | Where Faith, Science, and Technology Converge";
}
map $host $og_title {
    default "Sahal Education Platform";
    suganhub.com "Suganhub — A Center for Modern Learning";
    www.suganhub.com "Suganhub — A Center for Modern Learning";
}
map $host $og_description {
    default "Manage students, courses, exams, attendance, and billing — all in one platform for your school, university, or training center.";
    suganhub.com "A modern learning center spanning 21st-century skills, languages, Islamic studies, mathematics, science, and life skills.";
    www.suganhub.com "A modern learning center spanning 21st-century skills, languages, Islamic studies, mathematics, science, and life skills.";
}
map $host $meta_description {
    default "Sahal Education Platform - A complete platform for schools, universities, colleges, and training centers.";
    suganhub.com "Suganhub — a modern learning center for faith, science, and technology.";
    www.suganhub.com "Suganhub — a modern learning center for faith, science, and technology.";
}
map $host $og_image {
    default "/icons/pwa-512x512.png";
    suganhub.com "/images/suganhub-hero.jpg";
    www.suganhub.com "/images/suganhub-hero.jpg";
}
map $host $og_url {
    default "https://sahaledu.com";
    suganhub.com "https://suganhub.com";
    www.suganhub.com "https://suganhub.com";
}

# The main site's install manifest must not depend on tenant resolution
# across the public API proxy. Organization hosts keep their dynamic manifest.
map $host $platform_manifest_host {
    default 0;
    sahaledu.com 1;
    www.sahaledu.com 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # The backend is deployed as a SEPARATE Coolify application (not a
    # docker-compose service), so it has no Docker-internal hostname this
    # container can resolve — proxy to its public URL instead (a real,
    # always-resolvable public domain, unlike the old internal-only name
    # that made nginx fail to start and crash-loop the whole container).
    # The Host header must stay api.sahaledu.com so Coolify's edge proxy
    # routes the request to the right app; the original tenant subdomain
    # the visitor requested is preserved in X-Forwarded-Host for the
    # backend's tenant middleware to read.
    # Serve a valid platform manifest even when the backend edge proxy
    # replaces X-Forwarded-Host or tenant lookup is unavailable. A return
    # inside an nginx if is safe; tenant hosts continue to the proxy below.
    location = /api/v1/tenant/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        if ($platform_manifest_host) {
            return 200 '{"id":"/","name":"Sahal Education Platform","short_name":"Sahal","description":"A complete platform for schools, universities, colleges, and training centers.","start_url":"/","scope":"/","display":"standalone","background_color":"#ffffff","theme_color":"#059669","icons":[{"src":"/icons/pwa-192x192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"/icons/pwa-512x512.png","sizes":"512x512","type":"image/png","purpose":"any"}]}';
        }

        proxy_pass https://api.sahaledu.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sahaledu.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass https://api.sahaledu.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sahaledu.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Socket.IO (WebSocket) — same backend, needs the Upgrade/Connection
    # headers the plain /api/ block above doesn't set.
    location /socket.io/ {
        proxy_pass https://api.sahaledu.com/socket.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sahaledu.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        sub_filter_once off;
        sub_filter '<title>Sahal Education Platform | منصة سهل التعليمية</title>' '<title>$doc_title</title>';
        sub_filter 'content="Sahal Education Platform - A complete platform for schools, universities, colleges, and training centers."' 'content="$meta_description"';
        sub_filter 'content="Sahal Education Platform"' 'content="$og_title"';
        sub_filter 'content="Manage students, courses, exams, attendance, and billing — all in one platform for your school, university, or training center."' 'content="$og_description"';
        sub_filter 'content="/icons/pwa-512x512.png"' 'content="$og_image"';
        sub_filter 'content="https://sahaledu.com"' 'content="$og_url"';
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
