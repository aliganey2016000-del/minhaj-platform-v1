name: Patch Record Payment V6
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/payments-record.tsx')
          s = p.read_text()
          if 'const [balanceLoading, setBalanceLoading]' in s:
              print('Record Payment balance refresh already present')
              raise SystemExit(0)
          marker = '  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;\n'
          if marker not in s:
              raise SystemExit('expected isValid marker not found')
          insertion = '''  const [balanceLoading, setBalanceLoading] = useState(false);\n'''
          insertion += marker
          insertion += '''  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);\n\n  useEffect(() => {\n    if (!selectedStudent?._id) return;\n    let cancelled = false;\n    setBalanceLoading(true);\n    api.get('/payments/student-balances', { params: { search: selectedStudent.studentId } })\n      .then(({ data }) => {\n        const match = (data.data?.students || []).find((s: StudentBrief) => s._id === selectedStudent._id);\n        if (!cancelled && match) {\n          setSelectedStudent(prev => prev ? {\n            ...prev,\n            totalFees: Number(match.totalFees ?? 0),\n            totalFeesPaid: Number(match.totalFeesPaid ?? 0),\n            totalFeesDue: Number(match.totalFeesDue ?? 0),\n            discount: Number(match.discount ?? 0),\n          } : prev);\n        }\n      })\n      .catch(() => { /* Keep identity data if balance refresh fails. */ })\n      .finally(() => { if (!cancelled) setBalanceLoading(false); });\n    return () => { cancelled = true; };\n  }, [selectedStudent?._id, selectedStudent?.studentId]);\n'''
          old_summary = marker + '  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);\n'
          if old_summary not in s:
              raise SystemExit('expected fee summary marker not found')
          p.write_text(s.replace(old_summary, insertion, 1))
          PY
      - name: Commit patched frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/frontend/src/features/admin/pages/payments-record.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(finance): refresh record payment balance from invoices"
          git push origin HEAD:fix/record-payment-balance-sync-v6
