name: Patch Record Payment V6
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/record-payment-balance-sync-v6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/payments-record.tsx')
          s = p.read_text()
          old = """  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;
  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);
"""
          new = """  const [balanceLoading, setBalanceLoading] = useState(false);
  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;
  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);

  useEffect(() => {
    if (!selectedStudent?._id) return;
    let cancelled = false;
    setBalanceLoading(true);
    api.get('/payments/student-balances', { params: { search: selectedStudent.studentId } })
      .then(({ data }) => {
        const match = (data.data?.students || []).find((s: StudentBrief) => s._id === selectedStudent._id);
        if (!cancelled && match) {
          setSelectedStudent(prev => prev ? {
            ...prev,
            totalFees: Number(match.totalFees ?? 0),
            totalFeesPaid: Number(match.totalFeesPaid ?? 0),
            totalFeesDue: Number(match.totalFeesDue ?? 0),
            discount: Number(match.discount ?? 0),
          } : prev);
        }
      })
      .catch(() => { /* Keep identity data if balance refresh fails. */ })
      .finally(() => { if (!cancelled) setBalanceLoading(false); });
    return () => { cancelled = true; };
  }, [selectedStudent?._id, selectedStudent?.studentId]);
"""
          if old not in s:
              raise SystemExit('expected balance marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patched frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/frontend/src/features/admin/pages/payments-record.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(finance): refresh record payment balance from invoices"
          git push
