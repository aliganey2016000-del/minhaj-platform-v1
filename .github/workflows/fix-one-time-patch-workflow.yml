name: Fix one-time UI patch workflow

on:
  push:
    branches:
      - fix/manage-students-table-ui

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix workflow expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/one-time-student-table-ui-patch.yml')
          text = p.read_text()
          text = text.replace("if: ${{ !contains(github.event.head_commit.message, '[ui-patch]') }}", "if: ${{ ! contains(github.event.head_commit.message, '[ui-patch]') }}")
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-student-table-ui-patch.yml
          git commit -m 'chore: fix one-time patch workflow expression'
          git push origin HEAD:fix/manage-students-table-ui
