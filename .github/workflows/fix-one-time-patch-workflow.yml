name: Fix one-time UI patch workflow

on:
  push:
    branches:
      - fix/manage-students-table-ui

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Manage Students UI patch
        run: python scripts/one-time-manage-students-ui-patch.py
