name: HR navigation refactor

on:
  push:
    branches: [feature/hr-management-navigation]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hr-management-navigation
          fetch-depth: 1

      - name: Refactor HR navigation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sidebar = Path('apps/frontend/src/features/admin/components/admin-sidebar.tsx')
          text = sidebar.read_text()
          text = text.replace('Trash2, FileText, Receipt, FileBarChart, BadgePercent, Landmark,', 'Trash2, FileText, Receipt, FileBarChart, BadgePercent, Landmark, UsersRound, UserCog2,')
          old = """      { path: '/admin/teachers',     label: 'Manage Teachers',    icon: Presentation },\n      { path: '/admin/staff',        label: 'Manage Staff',       icon: UserRound },\n      { path: '/admin/courses',      label: 'Manage Courses',     icon: BookOpen },"""
          new = """      { path: '/admin/teachers',     label: 'Manage Teachers',    icon: Presentation },\n      { path: '/admin/courses',      label: 'Manage Courses',     icon: BookOpen },"""
          if old not in text:
              raise SystemExit('Main staff nav block not found')
          text = text.replace(old, new, 1)
          anchor = """  {\n    title: 'Academic',\n    items: ["""
          hr = """  {\n    title: 'HR',\n    items: [\n      {\n        key: 'group:hr-management', label: 'HR Management', icon: UsersRound,\n        children: [\n          { path: '/admin/hr',          label: 'HR Dashboard',        icon: UserCog2 },\n          { path: '/admin/staff',       label: 'Staff Directory',     icon: UserRound },\n          { path: '/admin/hr/access',   label: 'Access & Permissions', icon: ShieldCheck },\n        ],\n      },\n    ],\n  },\n  {\n    title: 'Academic',\n    items: ["""
          if anchor not in text:
              raise SystemExit('Academic nav anchor not found')
          text = text.replace(anchor, hr, 1)
          sidebar.write_text(text)

          registry = Path('apps/backend/src/utils/sidebar-items.ts')
          text = registry.read_text()
          old = """  { key: 'admin/teachers', label: 'Manage Teachers', section: 'Main' },\n  { key: 'admin/staff', label: 'Manage Staff', section: 'Main' },\n  { key: 'admin/courses', label: 'Manage Courses', section: 'Main' },"""
          new = """  { key: 'admin/teachers', label: 'Manage Teachers', section: 'Main' },\n  { key: 'admin/courses', label: 'Manage Courses', section: 'Main' },\n\n  { key: 'group:hr-management', label: 'HR Management (entire menu)', section: 'HR' },\n  { key: 'admin/hr', label: 'HR Dashboard', section: 'HR' },\n  { key: 'admin/staff', label: 'Staff Directory', section: 'HR' },\n  { key: 'admin/hr/access', label: 'Access & Permissions', section: 'HR' },"""
          if old not in text:
              raise SystemExit('Backend staff registry block not found')
          text = text.replace(old, new, 1)
          old_mod = """  if (['admin/parents', 'admin/teachers', 'admin/staff', 'admin/schools', 'admin/users', 'admin/classes'].includes(key)) return 'organization';"""
          new_mod = """  if (['admin/parents', 'admin/teachers', 'admin/staff', 'admin/schools', 'admin/users', 'admin/classes'].includes(key)) return 'organization';\n  if (key === 'admin/hr' || key === 'admin/hr/access' || key === 'group:hr-management') return 'organization';"""
          if old_mod not in text:
              raise SystemExit('Backend module mapping not found')
          text = text.replace(old_mod, new_mod, 1)
          registry.write_text(text)

          routes = Path('apps/frontend/src/routes/index.tsx')
          text = routes.read_text()
          import_anchor = """const StaffManage = lazy(() => import('../features/admin/pages/staff-manage').then((m) => ({ default: m.StaffManage })));\nconst StaffAccessManage = lazy(() => import('../features/admin/pages/staff-access-manage').then((m) => ({ default: m.StaffAccessManage })));"""
          import_new = """const StaffManage = lazy(() => import('../features/admin/pages/staff-manage').then((m) => ({ default: m.StaffManage })));\nconst StaffAccessManage = lazy(() => import('../features/admin/pages/staff-access-manage').then((m) => ({ default: m.StaffAccessManage })));\nconst HrManagement = lazy(() => import('../features/admin/pages/hr-management').then((m) => ({ default: m.HrManagement })));\nconst HrAccessManage = lazy(() => import('../features/admin/pages/hr-access-manage').then((m) => ({ default: m.HrAccessManage })));"""
          if import_anchor not in text:
              raise SystemExit('Staff route imports not found')
          text = text.replace(import_anchor, import_new, 1)
          route_anchor = """  { path: 'admin/staff', element: L(<AdminGuard><AdminLayout /></AdminGuard>), children: [{ index: true, element: L(<StaffManage />) }, { path: ':staffId/access', element: L(<StaffAccessManage />) }] },"""
          route_new = """  { path: 'admin/hr', element: L(<AdminGuard><AdminLayout /></AdminGuard>), children: [{ index: true, element: L(<HrManagement />) }] },\n  { path: 'admin/hr/access', element: L(<AdminGuard><AdminLayout /></AdminGuard>), children: [{ index: true, element: L(<HrAccessManage />) }] },\n  { path: 'admin/staff', element: L(<AdminGuard><AdminLayout /></AdminGuard>), children: [{ index: true, element: L(<StaffManage />) }, { path: ':staffId/access', element: L(<StaffAccessManage />) }] },"""
          if route_anchor not in text:
              raise SystemExit('Staff route declaration not found')
          text = text.replace(route_anchor, route_new, 1)
          routes.write_text(text)
          PY

          cat > apps/frontend/src/features/admin/pages/hr-management.tsx <<'EOF'
          import { Link } from 'react-router-dom';
          import { ArrowRight, ShieldCheck, UsersRound, UserRound } from 'lucide-react';
          import { useAuth } from '../../../store/auth-context';

          const cards = [
            { title: 'Staff Directory', description: 'Create, edit, import and manage staff accounts.', to: '/admin/staff', icon: UserRound },
            { title: 'Access & Permissions', description: 'Control staff sidebar access and page actions.', to: '/admin/hr/access', icon: ShieldCheck },
          ];

          export function HrManagement() {
            const { user } = useAuth();
            return (
              <div className="space-y-6 p-4 sm:p-6">
                <div className="rounded-2xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-6 shadow-sm">
                  <div className="flex items-start gap-4">
                    <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary-700 dark:bg-primary-950/40 dark:text-primary-300">
                      <UsersRound className="h-6 w-6" />
                    </div>
                    <div className="min-w-0">
                      <p className="text-xs font-bold uppercase tracking-widest text-[var(--color-text-tertiary)]">Human Resources</p>
                      <h1 className="mt-1 text-2xl font-bold text-[var(--color-text-primary)]">HR Management</h1>
                      <p className="mt-1 text-sm text-[var(--color-text-secondary)]">Manage your school workforce, staff accounts and access from one place.</p>
                      <p className="mt-3 text-xs text-[var(--color-text-tertiary)]">Signed in as {user?.email || 'administrator'}</p>
                    </div>
                  </div>
                </div>

                <div className="grid gap-4 md:grid-cols-2">
                  {cards.map(({ title, description, to, icon: Icon }) => (
                    <Link key={to} to={to} className="group rounded-2xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
                      <div className="flex items-center justify-between gap-4">
                        <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--color-surface-tertiary)] text-[var(--color-text-secondary)]"><Icon className="h-5 w-5" /></div>
                        <ArrowRight className="h-4 w-4 text-[var(--color-text-tertiary)] transition group-hover:translate-x-1" />
                      </div>
                      <h2 className="mt-4 font-semibold text-[var(--color-text-primary)]">{title}</h2>
                      <p className="mt-1 text-sm leading-6 text-[var(--color-text-secondary)]">{description}</p>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          EOF

          cat > apps/frontend/src/features/admin/pages/hr-access-manage.tsx <<'EOF'
          import { useEffect, useState } from 'react';
          import { Search, ShieldCheck, UserRound } from 'lucide-react';
          import { useNavigate } from 'react-router-dom';
          import api from '../../../lib/axios';

          type Staff = { _id: string; email: string; isActive?: boolean; title?: string; profile?: { firstName?: string; lastName?: string } | null };

          export function HrAccessManage() {
            const navigate = useNavigate();
            const [staff, setStaff] = useState<Staff[]>([]);
            const [search, setSearch] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            useEffect(() => {
              (async () => {
                try {
                  const { data } = await api.get('/users', { params: { role: 'staff', limit: 100 } });
                  setStaff(data.data || []);
                } catch (err: any) {
                  setError(err.response?.data?.message || 'Failed to load staff');
                } finally {
                  setLoading(false);
                }
              })();
            }, []);

            const filtered = staff.filter((member) => {
              const name = `${member.profile?.firstName || ''} ${member.profile?.lastName || ''}`.trim();
              return `${name} ${member.email} ${member.title || ''}`.toLowerCase().includes(search.toLowerCase());
            });

            return (
              <div className="space-y-5 p-4 sm:p-6">
                <div>
                  <p className="text-xs font-bold uppercase tracking-widest text-[var(--color-text-tertiary)]">HR Management</p>
                  <h1 className="mt-1 text-2xl font-bold text-[var(--color-text-primary)]">Access & Permissions</h1>
                  <p className="mt-1 text-sm text-[var(--color-text-secondary)]">Select a staff member to manage portal pages and actions.</p>
                </div>
                <div className="relative max-w-md">
                  <Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[var(--color-text-tertiary)]" />
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search staff..." className="w-full rounded-xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] py-2.5 pl-9 pr-3 text-sm outline-none focus:ring-2 focus:ring-primary-500/30" />
                </div>
                {error && <div className="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">{error}</div>}
                <div className="overflow-hidden rounded-2xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)]">
                  {loading ? <div className="p-6 text-sm text-[var(--color-text-secondary)]">Loading staff...</div> : filtered.length === 0 ? <div className="p-8 text-center text-sm text-[var(--color-text-secondary)]">No staff members found.</div> : (
                    <div className="divide-y divide-[var(--color-border-subtle)]">
                      {filtered.map((member) => {
                        const name = `${member.profile?.firstName || ''} ${member.profile?.lastName || ''}`.trim() || member.email;
                        return <div key={member._id} className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
                          <div className="flex min-w-0 items-center gap-3">
                            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--color-surface-tertiary)] text-[var(--color-text-secondary)]"><UserRound className="h-5 w-5" /></div>
                            <div className="min-w-0"><p className="truncate text-sm font-semibold text-[var(--color-text-primary)]">{name}</p><p className="truncate text-xs text-[var(--color-text-secondary)]">{member.title || 'Staff'} · {member.email}</p></div>
                          </div>
                          <button onClick={() => navigate(`/admin/staff/${member._id}/access`)} className="inline-flex items-center justify-center gap-2 rounded-xl border border-[var(--color-border-default)] px-3 py-2 text-sm font-medium text-[var(--color-text-primary)] hover:bg-[var(--color-surface-tertiary)]"><ShieldCheck className="h-4 w-4" /> Manage access</button>
                        </div>;
                      })}
                    </div>
                  )}
                </div>
              </div>
            );
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/frontend/src/features/admin/components/admin-sidebar.tsx apps/backend/src/utils/sidebar-items.ts apps/frontend/src/routes/index.tsx apps/frontend/src/features/admin/pages/hr-management.tsx apps/frontend/src/features/admin/pages/hr-access-manage.tsx
          git rm .github/workflows/hr-navigation.yml
          git commit -m "feat(admin): create standalone HR Management section"
          git push origin feature/hr-management-navigation
