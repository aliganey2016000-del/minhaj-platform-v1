name: Fix student exam category typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/student/pages/student-exams.tsx')
          s = p.read_text()
          old = "  const getCat = (c: string) => catLabels[c]?.[lang] || c;"
          new = "  const getCat = (c: string) => lang === 'en' ? c : catLabels[c]?.[lang] || c;"
          if old not in s:
              raise SystemExit('Expected line not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/frontend/src/features/student/pages/student-exams.tsx
          git commit -m 'fix: handle English exam category labels'
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-exam-build.yml
          git commit -m 'chore: remove temporary exam build fix workflow'
          git push
