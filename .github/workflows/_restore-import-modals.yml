name: Restore management import modals

on:
  push:
    branches: [fix/restore-import-modals-teacher-class-course]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/restore-import-modals-teacher-class-course

      - name: Apply modal wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def patch(path, fn):
              p = root / path
              text = p.read_text()
              updated = fn(text)
              if updated == text:
                  raise SystemExit(f'No changes made to {path}; patch anchor not found')
              p.write_text(updated)
              print(f'patched {path}')

          teacher_headers = ['First Name', 'Last Name', 'Gender', 'Email', 'Password', 'Phone', 'Organization', 'Qualification', 'Specialization', 'Experience (years)', 'Joining Date', 'Bio']
          class_headers = ['Organization', 'Faculty', 'Department', 'Program', 'Batch Number', 'Grade Level', 'Academic Year', 'Study Year', 'Semester Number', 'Semester In Year', 'Final Grade (Yes/No)', 'Entry Grade (Yes/No)', 'Class Name', 'Section', 'Room', 'Capacity', 'Shift / Learning Mode', 'Status']
          course_headers = ['Course Title (English)', 'Category', 'Level', 'Organization Name', 'Class Title', 'Teacher Email', 'Duration (weeks)', 'Price ($)', 'Capacity', 'Thumbnail URL']

          def add_import_component(text):
              marker = "import api from '../../../lib/axios';"
              line = "import BulkEntityImportModal from './components/bulk-entity-import-modal';"
              if line not in text:
                  text = text.replace(marker, marker + "\n" + line, 1)
              return text

          def patch_teacher(text):
              text = add_import_component(text)
              text = text.replace("import { useCallback, useEffect, useMemo, useRef, useState } from 'react';", "import { useCallback, useEffect, useMemo, useState } from 'react';")
              text = text.replace("const [permSaving, setPermSaving] = useState(false); const fileRef = useRef<HTMLInputElement>(null);", "const [permSaving, setPermSaving] = useState(false); const [showImportModal, setShowImportModal] = useState(false);")
              text = re.sub(r"\n  const importTeachers = async \(file: File\) => \{.*?\};", "", text, count=1)
              text = re.sub(r"\n    <input ref=\{fileRef\} type=\"file\" accept=\"\.xlsx,\.xls,\.csv\" className=\"hidden\" onChange=.*? />", "", text, count=1)
              old = "<button onClick={() => { setMenuOpen(false); fileRef.current?.click(); }} className=\"flex w-full items-center gap-2 px-3 py-2.5 text-left text-sm hover:bg-[var(--color-surface-secondary)]\"><Upload size={16} /> Import</button>"
              new = "<button onClick={() => { setMenuOpen(false); setShowImportModal(true); }} className=\"flex w-full items-center gap-2 px-3 py-2.5 text-left text-sm hover:bg-[var(--color-surface-secondary)]\"><Upload size={16} /> Import</button>"
              if old not in text: raise SystemExit('Teacher Import menu anchor not found')
              text = text.replace(old, new, 1)
              modal = """
    {showImportModal && <BulkEntityImportModal
      title=\"Import Teachers\"
      description=\"Download the official template, upload an Excel/CSV file, or paste spreadsheet rows. Review the results and row-level errors before closing.\"
      templateUrl=\"/teachers/template\"
      importUrl=\"/teachers/import\"
      templateName=\"teachers-template.xlsx\"
      headers={teacher_headers}
      onClose={() => setShowImportModal(false)}
      onImported={load}
    />}
""".replace('{teacher_headers}', '{' + repr(teacher_headers).replace("'", "\"") + '}')
              anchor = "    {active && <div className=\"fixed bottom-3 right-3 z-40 hidden sm:block\">"
              if anchor not in text: raise SystemExit('Teacher modal insertion anchor not found')
              text = text.replace(anchor, modal + anchor, 1)
              return text

          def patch_class(text):
              text = add_import_component(text)
              text = text.replace("const [menu, setMenu] = useState(false); const [selected, setSelected] = useState<string[]>([]); const [importing, setImporting] = useState(false); const fileRef = useRef<HTMLInputElement>(null);", "const [menu, setMenu] = useState(false); const [selected, setSelected] = useState<string[]>([]); const [showImportModal, setShowImportModal] = useState(false);")
              text = re.sub(r"\n  const importXlsx = async \(file:File\) => \{.*?\};", "", text, count=1)
              old = "<button onClick={()=>{setMenu(false);fileRef.current?.click()}} className=\"flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800\"><Upload size={16}/> Import Classes</button>"
              new = "<button onClick={()=>{setMenu(false);setShowImportModal(true)}} className=\"flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800\"><Upload size={16}/> Import Classes</button>"
              if old not in text: raise SystemExit('Class Import menu anchor not found')
              text = text.replace(old, new, 1)
              text = re.sub(r"<input ref=\{fileRef\} hidden type=\"file\" accept=\"\.xlsx,\.xls\" onChange=.*?/>", "", text, count=1)
              text = re.sub(r"\n    \{importing && <div className=\"fixed bottom-4 right-4 rounded-xl bg-slate-900.*?</div>\}", "", text, count=1)
              modal = """
    {showImportModal && <BulkEntityImportModal
      title=\"Import Classes\"
      description=\"Download the institution-aware class template, upload a completed file, or paste spreadsheet rows and preview them before importing.\"
      templateUrl=\"/classes/template\"
      importUrl=\"/classes/import\"
      templateName=\"classes-template.xlsx\"
      headers={CLASS_HEADERS}
      onClose={() => setShowImportModal(false)}
      onImported={refresh}
    />}
""".replace('{CLASS_HEADERS}', '{' + repr(class_headers).replace("'", "\"") + '}')
              anchor = "    {modal.open && <ClassModal"
              if anchor not in text: raise SystemExit('Class modal insertion anchor not found')
              text = text.replace(anchor, modal + anchor, 1)
              return text

          def patch_course(text):
              text = add_import_component(text)
              text = re.sub(r"\n  const importCourses = async \(file: File\) => \{.*?\};", "", text, count=1)
              old = "<label className=\"flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-[var(--color-surface-tertiary)]\"><Upload className=\"h-4 w-4\" /> Import Courses<input type=\"file\" accept=\".csv,.xlsx\" className=\"hidden\" onChange=\{e => \{ const f = e.target.files\?\.\[0\]; if \(f\) importCourses\(f\); e.currentTarget.value = ''; \}\} /></label>"
              new = "<button onClick={() => { setShowImportModal(true); setMenuOpen(false); }} className=\"flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-[var(--color-surface-tertiary)]\"><Upload className=\"h-4 w-4\" /> Import Courses</button>"
              if old not in text: raise SystemExit('Course Import menu anchor not found')
              text = text.replace(old, new, 1)
              state_anchor = "  const [selected, setSelected] = useState<string[]>([]);\n  const type = resolveInstitutionType(org);"
              state_new = "  const [selected, setSelected] = useState<string[]>([]);\n  const [showImportModal, setShowImportModal] = useState(false);\n  const type = resolveInstitutionType(org);"
              if state_anchor not in text: raise SystemExit('Course state anchor not found')
              text = text.replace(state_anchor, state_new, 1)
              modal = """
    {showImportModal && <BulkEntityImportModal
      title=\"Import Courses\"
      description=\"Download the official course template, upload a completed spreadsheet, or paste rows directly from Excel/Google Sheets.\"
      templateUrl=\"/courses/template\"
      importUrl=\"/courses/import\"
      templateName=\"courses-template.xlsx\"
      headers={COURSE_HEADERS}
      onClose={() => setShowImportModal(false)}
      onImported={load}
    />}
""".replace('{COURSE_HEADERS}', '{' + repr(course_headers).replace("'", "\"") + '}')
              anchor = "    {modal && org && <CourseModal"
              if anchor not in text: raise SystemExit('Course modal insertion anchor not found')
              text = text.replace(anchor, modal + anchor, 1)
              return text

          patch('apps/frontend/src/features/admin/pages/teachers-manage.tsx', patch_teacher)
          patch('apps/frontend/src/features/admin/pages/classes-manage.tsx', patch_class)
          patch('apps/frontend/src/features/admin/pages/courses-manage.tsx', patch_course)

      - name: Validate and commit
        shell: bash
        run: |
          rm -f .github/workflows/_restore-import-modals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/pages/teachers-manage.tsx apps/frontend/src/features/admin/pages/classes-manage.tsx apps/frontend/src/features/admin/pages/courses-manage.tsx apps/frontend/src/features/admin/pages/components/bulk-entity-import-modal.tsx .github/workflows/_restore-import-modals.yml
          git commit -m "fix(admin): restore import modals for teachers classes and courses"
          git push origin fix/restore-import-modals-teacher-class-course
