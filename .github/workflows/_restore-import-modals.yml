name: Restore management import modals

on:
  push:
    branches: [fix/restore-import-modals-teacher-class-course]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/restore-import-modals-teacher-class-course

      - name: Apply modal wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          teacher_headers = ['First Name', 'Last Name', 'Gender', 'Email', 'Password', 'Phone', 'Organization', 'Qualification', 'Specialization', 'Experience (years)', 'Joining Date', 'Bio']
          class_headers = ['Organization', 'Faculty', 'Department', 'Program', 'Batch Number', 'Grade Level', 'Academic Year', 'Study Year', 'Semester Number', 'Semester In Year', 'Final Grade (Yes/No)', 'Entry Grade (Yes/No)', 'Class Name', 'Section', 'Room', 'Capacity', 'Shift / Learning Mode', 'Status']
          course_headers = ['Course Title (English)', 'Category', 'Level', 'Organization Name', 'Class Title', 'Teacher Email', 'Duration (weeks)', 'Price ($)', 'Capacity', 'Thumbnail URL']

          def add_component(text):
              marker = "import api from '../../../lib/axios';"
              line = "import BulkEntityImportModal from './components/bulk-entity-import-modal';"
              return text if line in text else text.replace(marker, marker + "\n" + line, 1)

          def patch(path, fn):
              p = root / path
              before = p.read_text()
              after = fn(before)
              if before == after:
                  raise RuntimeError(f'No change made to {path}')
              p.write_text(after)

          def patch_teacher(t):
              t = add_component(t)
              t = t.replace("import { useCallback, useEffect, useMemo, useRef, useState } from 'react';", "import { useCallback, useEffect, useMemo, useState } from 'react';")
              t = t.replace("const [permSaving, setPermSaving] = useState(false); const fileRef = useRef<HTMLInputElement>(null);", "const [permSaving, setPermSaving] = useState(false); const [showImportModal, setShowImportModal] = useState(false);")
              t = re.sub(r"\n  const importTeachers = async \(file: File\) => \{.*?\};", "", t, count=1)
              t = re.sub(r"\n    <input ref=\{fileRef\} type=\"file\" accept=\"\.xlsx,\.xls,\.csv\" className=\"hidden\" onChange=.*? />", "", t, count=1)
              old_handler = "fileRef.current?.click()"
              if old_handler not in t: raise RuntimeError('Teacher import handler anchor missing')
              t = t.replace(old_handler, 'setShowImportModal(true)', 1)
              jsx = '[' + ', '.join('"' + h.replace('"', '\\"') + '"' for h in teacher_headers) + ']'
              modal = f'''\n    {{showImportModal && <BulkEntityImportModal\n      title="Import Teachers"\n      description="Download the official template, upload an Excel/CSV file, or paste spreadsheet rows. Review the results and row-level errors before closing."\n      templateUrl="/teachers/template"\n      importUrl="/teachers/import"\n      templateName="teachers-template.xlsx"\n      headers={{jsx}}\n      onClose={{() => setShowImportModal(false)}}\n      onImported={{load}}\n    />}}\n'''
              anchor = "    {active && <div className=\"fixed bottom-3 right-3 z-40 hidden sm:block\">"
              if anchor not in t: raise RuntimeError('Teacher modal anchor missing')
              return t.replace(anchor, modal + anchor, 1)

          def patch_class(t):
              t = add_component(t)
              t = t.replace("import { useCallback, useEffect, useMemo, useRef, useState, type FormEvent, type ReactNode } from 'react';", "import { useCallback, useEffect, useMemo, useState, type FormEvent, type ReactNode } from 'react';")
              t = t.replace("const [menu, setMenu] = useState(false); const [selected, setSelected] = useState<string[]>([]); const [importing, setImporting] = useState(false); const fileRef = useRef<HTMLInputElement>(null);", "const [menu, setMenu] = useState(false); const [selected, setSelected] = useState<string[]>([]); const [showImportModal, setShowImportModal] = useState(false);")
              t = re.sub(r"\n  const importXlsx = async \(file:File\) => \{.*?\};", "", t, count=1)
              if "fileRef.current?.click()" not in t: raise RuntimeError('Class import handler anchor missing')
              t = t.replace("fileRef.current?.click()", "setShowImportModal(true)", 1)
              t = re.sub(r'<input ref=\{fileRef\} hidden type="file" accept="\.xlsx,\.xls" onChange=.*?/>', '', t, count=1)
              t = re.sub(r'\n\s*\{importing && <div className="fixed bottom-4 right-4 rounded-xl bg-slate-900.*?</div>\}', '', t, count=1, flags=re.S)
              jsx = '[' + ', '.join('"' + h.replace('"', '\\"') + '"' for h in class_headers) + ']'
              modal = f'''\n    {{showImportModal && <BulkEntityImportModal\n      title="Import Classes"\n      description="Download the institution-aware class template, upload a completed file, or paste spreadsheet rows and preview them before importing."\n      templateUrl="/classes/template"\n      importUrl="/classes/import"\n      templateName="classes-template.xlsx"\n      headers={{jsx}}\n      onClose={{() => setShowImportModal(false)}}\n      onImported={{refresh}}\n    />}}\n'''
              anchor = "    {modal.open && <ClassModal"
              if anchor not in t: raise RuntimeError('Class modal anchor missing')
              return t.replace(anchor, modal + anchor, 1)

          def patch_course(t):
              t = add_component(t)
              t = re.sub(r"\n  const importCourses = async \(file: File\) => \{.*?\};", "", t, count=1)
              pattern = r'<label[^>]*>.*?Import Courses<input.*?</label>'
              replacement = '<button onClick={() => { setShowImportModal(true); setMenuOpen(false); }} className="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-[var(--color-surface-tertiary)]"><Upload className="h-4 w-4" /> Import Courses</button>'
              t, count = re.subn(pattern, replacement, t, count=1, flags=re.S)
              if count != 1: raise RuntimeError('Course import menu anchor missing')
              state = "  const [selected, setSelected] = useState<string[]>([]);\n  const type = resolveInstitutionType(org);"
              if state not in t: raise RuntimeError('Course state anchor missing')
              t = t.replace(state, "  const [selected, setSelected] = useState<string[]>([]);\n  const [showImportModal, setShowImportModal] = useState(false);\n  const type = resolveInstitutionType(org);", 1)
              jsx = '[' + ', '.join('"' + h.replace('"', '\\"') + '"' for h in course_headers) + ']'
              modal = f'''\n    {{showImportModal && <BulkEntityImportModal\n      title="Import Courses"\n      description="Download the official course template, upload a completed spreadsheet, or paste rows directly from Excel/Google Sheets."\n      templateUrl="/courses/template"\n      importUrl="/courses/import"\n      templateName="courses-template.xlsx"\n      headers={{jsx}}\n      onClose={{() => setShowImportModal(false)}}\n      onImported={{load}}\n    />}}\n'''
              anchor = "    {modal && org && <CourseModal"
              if anchor not in t: raise RuntimeError('Course modal anchor missing')
              return t.replace(anchor, modal + anchor, 1)

          patch('apps/frontend/src/features/admin/pages/teachers-manage.tsx', patch_teacher)
          patch('apps/frontend/src/features/admin/pages/classes-manage.tsx', patch_class)
          patch('apps/frontend/src/features/admin/pages/courses-manage.tsx', patch_course)
          print('all three pages patched')
          PY

      - name: Commit patch and remove one-off workflows
        run: |
          rm -f .github/workflows/_restore-import-modals.yml .github/workflows/restore-import-modals-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/pages/teachers-manage.tsx apps/frontend/src/features/admin/pages/classes-manage.tsx apps/frontend/src/features/admin/pages/courses-manage.tsx apps/frontend/src/features/admin/pages/components/bulk-entity-import-modal.tsx .github/workflows/_restore-import-modals.yml .github/workflows/restore-import-modals-v2.yml
          git commit -m "fix(admin): restore import modals for teachers classes and courses"
          git push origin fix/restore-import-modals-teacher-class-course
