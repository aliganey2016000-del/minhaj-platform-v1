name: Apply Department Multi-select Fix

on:
  push:
    paths:
      - .github/workflows/_tmp_fix_department_multiselect.yml

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: generate invoices department multi-select') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Generate Invoices modal
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/frontend/src/features/admin/pages/invoices-manage.tsx')
          text = path.read_text()

          text = text.replace(
              "const [departmentId, setDepartmentId] = useState('');",
              "const [departmentIds, setDepartmentIds] = useState<string[]>([]);",
              1,
          )

          old = '''  const visibleStructures = useMemo(() => {
    if (!departmentId) return feeStructures;
    return feeStructures.filter((fs) => {
      const ref = fs.scopeRef;
      const id = typeof ref === 'object' ? ref?._id : ref;
      return String(id) === departmentId;
    });
  }, [feeStructures, departmentId]);'''
          new = '''  const visibleStructures = useMemo(() => {
    if (departmentIds.length === 0) return feeStructures;
    const selected = new Set(departmentIds);
    return feeStructures.filter((fs) => {
      if (fs.scopeType !== 'department') return false;
      const ref = fs.scopeRef;
      const id = typeof ref === 'object' ? ref?._id : ref;
      return Boolean(id && selected.has(String(id)));
    });
  }, [feeStructures, departmentIds]);

  const allDepartmentsSelected = departments.length > 0 && departmentIds.length === departments.length;
  const toggleDepartment = (id: string) => {
    setDepartmentIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  };
  const toggleAllDepartments = () => {
    setDepartmentIds(allDepartmentsSelected ? [] : departments.map((d) => d._id));
  };'''
          if old not in text:
              raise SystemExit('visibleStructures block not found')
          text = text.replace(old, new, 1)

          old = '''  const [deptOpen, setDeptOpen] = useState(false);
  const [structOpen, setStructOpen] = useState(false);
  const deptRef = useRef<HTMLButtonElement>(null);
  const structRef = useRef<HTMLButtonElement>(null);'''
          new = '''  const [deptOpen, setDeptOpen] = useState(false);
  const [structOpen, setStructOpen] = useState(false);
  const deptRef = useRef<HTMLButtonElement>(null);
  const deptMenuRef = useRef<HTMLDivElement>(null);
  const structRef = useRef<HTMLButtonElement>(null);
  const structMenuRef = useRef<HTMLDivElement>(null);'''
          if old not in text:
              raise SystemExit('refs block not found')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {
    const h = (event: MouseEvent) => {
      if (deptRef.current && !deptRef.current.contains(event.target as Node)) setDeptOpen(false);
      if (structRef.current && !structRef.current.contains(event.target as Node)) setStructOpen(false);
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);'''
          new = '''  useEffect(() => {
    const h = (event: MouseEvent) => {
      const target = event.target as Node;
      if (deptOpen && !deptRef.current?.contains(target) && !deptMenuRef.current?.contains(target)) setDeptOpen(false);
      if (structOpen && !structRef.current?.contains(target) && !structMenuRef.current?.contains(target)) setStructOpen(false);
    };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [deptOpen, structOpen]);

  useEffect(() => {
    const visibleIds = new Set(visibleStructures.map((fs) => fs._id));
    setSelectedIds((prev) => prev.filter((id) => visibleIds.has(id)));
  }, [visibleStructures]);'''
          if old not in text:
              raise SystemExit('outside-click block not found')
          text = text.replace(old, new, 1)

          old = '''<div style={{ position: 'fixed', top: r.bottom + 4, left: r.left, width: r.width, zIndex: 100000 }} className="max-h-64 overflow-y-auto rounded-xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-1 shadow-2xl">'''
          new = '''<div ref={deptMenuRef} style={{ position: 'fixed', top: r.bottom + 4, left: r.left, width: r.width, zIndex: 100000 }} className="max-h-72 overflow-y-auto rounded-xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-1 shadow-2xl">'''
          if old not in text:
              raise SystemExit('department portal not found')
          text = text.replace(old, new, 1)

          old = '''<div style={{ position: 'fixed', top: r.bottom + 4, left: r.left, width: r.width, zIndex: 100000 }} className="max-h-72 overflow-y-auto rounded-xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-1 shadow-2xl">'''
          new = '''<div ref={structMenuRef} style={{ position: 'fixed', top: r.bottom + 4, left: r.left, width: r.width, zIndex: 100000 }} className="max-h-72 overflow-y-auto rounded-xl border border-[var(--color-border-default)] bg-[var(--color-surface-primary)] p-1 shadow-2xl">'''
          if old not in text:
              raise SystemExit('structure portal not found')
          text = text.replace(old, new, 1)

          old = '''<span className={departmentId ? 'text-[var(--color-text-primary)]' : 'text-[var(--color-text-tertiary)]'}>{departmentId ? (departments.find(d => d._id === departmentId)?.name || 'All Departments') : 'All Departments'}</span>'''
          new = '''<span className={departmentIds.length ? 'text-[var(--color-text-primary)]' : 'text-[var(--color-text-tertiary)]'}>{departmentIds.length === 0 ? 'All Departments' : allDepartmentsSelected ? 'All Departments' : departmentIds.map(id => departments.find(d => d._id === id)?.name).filter(Boolean).join(', ')}</span>'''
          if old not in text:
              raise SystemExit('department label not found')
          text = text.replace(old, new, 1)

          start = text.find('{deptOpen && deptRef.current && (() => { const r = deptRef.current!.getBoundingClientRect(); return createPortal(')
          if start < 0:
              raise SystemExit('department render start not found')
          end = text.find('              ); })()}', start)
          if end < 0:
              raise SystemExit('department render end not found')
          block = text[start:end]
          marker = '                <div ref={deptMenuRef}'
          wrapper_start = block.find(marker)
          if wrapper_start < 0:
              raise SystemExit('department wrapper not found')
          wrapper_end = block.rfind('                </div>')
          if wrapper_end < 0:
              raise SystemExit('department wrapper end not found')
          wrapper_open = block[wrapper_start:block.find('>', wrapper_start)+1]
          menu = '''
                  <button type="button" onClick={toggleAllDepartments} className={`flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm ${allDepartmentsSelected ? 'bg-primary-500/10 font-semibold' : 'hover:bg-[var(--color-surface-tertiary)]'}`}>
                    <span className={`flex h-4 w-4 shrink-0 items-center justify-center rounded border ${allDepartmentsSelected ? 'border-primary-600 bg-primary-600 text-white' : 'border-[var(--color-border-default)]'}`}>{allDepartmentsSelected ? '✓' : ''}</span>
                    <span className="flex-1">All Departments</span>
                  </button>
                  {departments.map(d => {
                    const checked = departmentIds.includes(d._id);
                    return <button key={d._id} type="button" onClick={() => toggleDepartment(d._id)} className={`flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm ${checked ? 'bg-primary-500/10' : 'hover:bg-[var(--color-surface-tertiary)]'}`}>
                      <span className={`flex h-4 w-4 shrink-0 items-center justify-center rounded border ${checked ? 'border-primary-600 bg-primary-600 text-white' : 'border-[var(--color-border-default)]'}`}>{checked ? '✓' : ''}</span>
                      <span className="flex-1 truncate">{d.name}</span>
                    </button>;
                  })}
                  <div className="mt-1 border-t border-[var(--color-border-default)] pt-1">
                    <button type="button" onClick={() => setDeptOpen(false)} className="w-full rounded-lg px-3 py-2 text-center text-xs font-semibold text-primary-600 hover:bg-[var(--color-surface-tertiary)]">Done</button>
                  </div>'''
          new_block = block[:wrapper_start] + wrapper_open + menu + '                </div>'
          text = text[:start] + new_block + text[end:]

          text = text.replace('Pick a department to show only the fee structures meant for it.', 'Select one or more departments, or choose All Departments.', 1)
          path.write_text(text)

      - name: Build and lint frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit final source fix
        run: |
          git diff --check
          git add apps/frontend/src/features/admin/pages/invoices-manage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: generate invoices department multi-select"
          git rm .github/workflows/_tmp_fix_department_multiselect.yml
          git commit --amend --no-edit
          git push
