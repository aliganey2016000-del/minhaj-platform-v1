name: Fix Finance Report Route

on:
  push:
    branches:
      - feature/finance-report-route-fix

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix report endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/finance-center.tsx')
          s = p.read_text()
          old = "api.get('/accounting/reports/profit-loss', { params: { dateFrom: from, dateTo: to } })"
          new = "api.get('/accounting/reports/profit-and-loss', { params: { dateFrom: from, dateTo: to } })"
          if old not in s:
              raise SystemExit('Expected finance report endpoint not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/pages/finance-center.tsx
          git rm .github/workflows/fix-finance-report-route.yml
          git commit -m "fix(finance): use correct profit and loss report endpoint"
          git push
