name: Tmp Accounting Payment Integration
on:
  push:
    branches:
      - feature/accounting-payment-posting-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch accounting integration
        env:
          BRANCH: feature/accounting-payment-posting-v1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label}: marker not found in {path}')
              p.write_text(text.replace(old, new, 1))

          accounting = Path('apps/backend/src/services/accounting.service.ts')
          text = accounting.read_text()
          marker = "export async function getAccounts(schoolId: Id) {"
          if marker not in text:
              raise SystemExit('accounting service insertion marker not found')
          insert = r'''export async function getAccountByCode(schoolId: Id, code: string) {
            return Account.findOne({ school: toId(schoolId), code: String(code).trim(), active: true });
          }

          async function getPostingAccounts(schoolId: Id, postedBy: Id) {
            const accounts = await ensureDefaultAccounts(schoolId, postedBy);
            const byCode = new Map(accounts.map((account) => [account.code, account]));
            const required = ['1100', '1110', '1120', '1130', '1200', '4100', '4200', '5100'];
            for (const code of required) {
              if (!byCode.has(code)) throw new BadRequestError(`Missing default accounting account ${code}`);
            }
            return byCode;
          }

          export async function postInvoiceToLedger(params: {
            schoolId: Id;
            invoiceId: Id;
            amount: number;
            discount?: number;
            paymentType?: string;
            description?: string;
            postedBy: Id;
            entryDate?: Date;
          }) {
            const amount = Number(params.amount || 0);
            const discount = Number(params.discount || 0);
            const net = Math.max(0, amount - discount);
            if (amount <= 0) return null;
            const existing = await JournalEntry.findOne({ sourceType: 'invoice', sourceId: toId(params.invoiceId), school: toId(params.schoolId) });
            if (existing) return existing;
            const accounts = await getPostingAccounts(params.schoolId, params.postedBy);
            const revenueCode = params.paymentType === 'tuition' ? '4100' : '4200';
            const lines: IJournalLine[] = [];
            if (net > 0) lines.push({ account: accounts.get('1200')!._id as mongoose.Types.ObjectId, description: 'Accounts receivable', debit: net, credit: 0 });
            if (discount > 0) lines.push({ account: accounts.get('5100')!._id as mongoose.Types.ObjectId, description: 'Invoice discount', debit: discount, credit: 0 });
            lines.push({ account: accounts.get(revenueCode)!._id as mongoose.Types.ObjectId, description: 'Student fee revenue', debit: 0, credit: amount });
            try {
              return await createJournalEntry({
                schoolId: params.schoolId,
                entryDate: params.entryDate,
                description: params.description || 'Invoice posted to accounting ledger',
                sourceType: 'invoice',
                sourceId: params.invoiceId,
                lines,
                postedBy: params.postedBy,
              });
            } catch (err: any) {
              if (err?.code === 11000) return JournalEntry.findOne({ sourceType: 'invoice', sourceId: toId(params.invoiceId), school: toId(params.schoolId) });
              throw err;
            }
          }

          export async function postPaymentToLedger(params: {
            schoolId: Id;
            paymentId: Id;
            amount: number;
            discount?: number;
            method?: string;
            postedBy: Id;
            entryDate?: Date;
          }) {
            const amount = Number(params.amount || 0);
            const discount = Number(params.discount || 0);
            const cash = Math.max(0, amount - discount);
            if (cash <= 0 && discount <= 0) return null;
            const existing = await JournalEntry.findOne({ sourceType: 'payment', sourceId: toId(params.paymentId), school: toId(params.schoolId) });
            if (existing) return existing;
            const accounts = await getPostingAccounts(params.schoolId, params.postedBy);
            const method = String(params.method || 'cash').toLowerCase();
            const assetCode = method === 'bank_transfer' ? '1110' : method === 'mobile_money' ? '1120' : method === 'online' ? '1130' : '1100';
            const lines: IJournalLine[] = [];
            if (cash > 0) lines.push({ account: accounts.get(assetCode)!._id as mongoose.Types.ObjectId, description: `${method} payment`, debit: cash, credit: 0 });
            if (discount > 0) lines.push({ account: accounts.get('5100')!._id as mongoose.Types.ObjectId, description: 'Payment discount', debit: discount, credit: 0 });
            lines.push({ account: accounts.get('1200')!._id as mongoose.Types.ObjectId, description: 'Accounts receivable settlement', debit: 0, credit: amount });
            try {
              return await createJournalEntry({
                schoolId: params.schoolId,
                entryDate: params.entryDate,
                description: 'Payment posted to accounting ledger',
                sourceType: 'payment',
                sourceId: params.paymentId,
                lines,
                postedBy: params.postedBy,
              });
            } catch (err: any) {
              if (err?.code === 11000) return JournalEntry.findOne({ sourceType: 'payment', sourceId: toId(params.paymentId), school: toId(params.schoolId) });
              throw err;
            }
          }

          export async function postRefundToLedger(params: {
            schoolId: Id;
            refundId: Id;
            amount: number;
            method?: string;
            postedBy: Id;
            entryDate?: Date;
          }) {
            const amount = Number(params.amount || 0);
            if (amount <= 0) return null;
            const existing = await JournalEntry.findOne({ sourceType: 'refund', sourceId: toId(params.refundId), school: toId(params.schoolId) });
            if (existing) return existing;
            const accounts = await getPostingAccounts(params.schoolId, params.postedBy);
            const method = String(params.method || 'cash').toLowerCase();
            const assetCode = method === 'bank_transfer' ? '1110' : method === 'mobile_money' ? '1120' : method === 'online' ? '1130' : '1100';
            try {
              return await createJournalEntry({
                schoolId: params.schoolId,
                entryDate: params.entryDate,
                description: 'Refund posted to accounting ledger',
                sourceType: 'refund',
                sourceId: params.refundId,
                lines: [
                  { account: accounts.get('1200')!._id as mongoose.Types.ObjectId, description: 'Refunded receivable', debit: amount, credit: 0 },
                  { account: accounts.get(assetCode)!._id as mongoose.Types.ObjectId, description: `${method} refund`, debit: 0, credit: amount },
                ],
                postedBy: params.postedBy,
              });
            } catch (err: any) {
              if (err?.code === 11000) return JournalEntry.findOne({ sourceType: 'refund', sourceId: toId(params.refundId), school: toId(params.schoolId) });
              throw err;
            }
          }

          '''
          accounting.write_text(text.replace(marker, insert + marker, 1))

          billing = 'apps/backend/src/services/billing.service.ts'
          p = Path(billing)
          text = p.read_text()
          replace_once(billing,
            "import { DiscountGrant } from '../models/discount-grant.model';" if False else "import DiscountGrant from '../models/discount-grant.model';",
            "import DiscountGrant from '../models/discount-grant.model';\nimport { postInvoiceToLedger, postPaymentToLedger } from './accounting.service';",
            'billing import')
          old_recalc = """export async function recalcStudentBalance(studentId: Id): Promise<void> {
            const invoices = await Invoice.find({ student: studentId, status: { $ne: 'void' } }).select('amount discount amountPaid').lean();
            const totalFees = invoices.reduce((sum, inv: any) => sum + (inv.amount || 0), 0);
            const totalFeesPaid = invoices.reduce((sum, inv: any) => sum + (inv.amountPaid || 0), 0);
            const totalFeesDue = invoices.reduce((sum, inv: any) => sum + Math.max(0, (inv.amount || 0) - (inv.discount || 0) - (inv.amountPaid || 0)), 0);
            await Student.findByIdAndUpdate(studentId, { totalFees, totalFeesPaid, totalFeesDue });
          }"""
          new_recalc = """export async function recalcStudentBalance(studentId: Id): Promise<void> {
            const invoices = await Invoice.find({ student: studentId, status: { $ne: 'void' } }).select('amount discount amountPaid school paymentType title issueDate generatedBy').lean();
            const totalFees = invoices.reduce((sum, inv: any) => sum + (inv.amount || 0), 0);
            const totalFeesPaid = invoices.reduce((sum, inv: any) => sum + (inv.amountPaid || 0), 0);
            const totalFeesDue = invoices.reduce((sum, inv: any) => sum + Math.max(0, (inv.amount || 0) - (inv.discount || 0) - (inv.amountPaid || 0)), 0);
            for (const invoice of invoices as any[]) {
              if (invoice.school && invoice.generatedBy) {
                await postInvoiceToLedger({
                  schoolId: invoice.school,
                  invoiceId: invoice._id,
                  amount: invoice.amount,
                  discount: invoice.discount || 0,
                  paymentType: invoice.paymentType,
                  description: `Invoice: ${invoice.title || 'Student fee'}`,
                  postedBy: invoice.generatedBy,
                  entryDate: invoice.issueDate,
                });
              }
            }
            await Student.findByIdAndUpdate(studentId, { totalFees, totalFeesPaid, totalFeesDue });
          }"""
          replace_once(billing, old_recalc, new_recalc, 'recalc')
          old_payment = """    });
    await recalcStudentBalance(studentId);
    return { payment, invoice: updatedInvoice };"""
          new_payment = """    });
    if (updatedInvoice.school) {
      await postPaymentToLedger({
        schoolId: updatedInvoice.school,
        paymentId: payment._id,
        amount: cash,
        discount: waiver,
        method,
        postedBy: recordedBy,
        entryDate: paymentDate,
      });
    }
    await recalcStudentBalance(studentId);
    return { payment, invoice: updatedInvoice };"""
          replace_once(billing, old_payment, new_payment, 'payment posting')

          refund = 'apps/backend/src/controllers/refund.controller.ts'
          p = Path(refund)
          text = p.read_text()
          replace_once(refund,
            "import { reverseInvoicePayment, restoreInvoicePayment, recalcStudentBalance } from '../services/billing.service';",
            "import { reverseInvoicePayment, restoreInvoicePayment, recalcStudentBalance } from '../services/billing.service';\nimport { postRefundToLedger } from '../services/accounting.service';",
            'refund import')
          old_refund = """  if (fullyRefunded) await Payment.findByIdAndUpdate(payment._id, { status: 'refunded' });

  await recalcStudentBalance(payment.student);"""
          new_refund = """  if (fullyRefunded) await Payment.findByIdAndUpdate(payment._id, { status: 'refunded' });

  if (payment.school) {
    await postRefundToLedger({
      schoolId: payment.school,
      refundId: refund._id,
      amount: refundAmount,
      method: payment.method,
      postedBy: req.user!.userId,
    });
  }

  await recalcStudentBalance(payment.student);"""
          replace_once(refund, old_refund, new_refund, 'refund posting')

          # Remove this temporary workflow before committing the patch.
          wf = Path('.github/workflows/_tmp_accounting_payment_integration.yml')
          if wf.exists(): wf.unlink()
          PY

      - name: Commit accounting integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/services/accounting.service.ts apps/backend/src/services/billing.service.ts apps/backend/src/controllers/refund.controller.ts .github/workflows/_tmp_accounting_payment_integration.yml
          git commit -m "feat(finance): post invoices payments and refunds to ledger" || exit 0
          git push origin "$BRANCH"
