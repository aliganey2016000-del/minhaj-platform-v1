name: Fix Class Controller Syntax

on:
  push:
    branches:
      - fix/manage-classes-school-alignment-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'fix/manage-classes-school-alignment-clean';
            const path = 'apps/backend/src/controllers/class.controller.ts';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const text = Buffer.from(file.data.content, 'base64').toString('utf8');
            const fixed = text.replace('\n/ GET /classes/template', '\n// GET /classes/template');
            if (fixed === text) throw new Error('Expected malformed template comment not found');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'fix(classes): restore class controller template comment',
              content: Buffer.from(fixed, 'utf8').toString('base64'),
              sha: file.data.sha,
            });
            const temp = await github.rest.repos.getContent({ owner, repo, path: '.github/workflows/fix-class-controller-syntax.yml', ref: branch });
            await github.rest.repos.deleteFile({ owner, repo, path: '.github/workflows/fix-class-controller-syntax.yml', branch, sha: temp.data.sha, message: 'chore: remove temporary syntax fixer' });
            try {
              const trigger = await github.rest.repos.getContent({ owner, repo, path: '.github/class-alignment-trigger.txt', ref: branch });
              await github.rest.repos.deleteFile({ owner, repo, path: '.github/class-alignment-trigger.txt', branch, sha: trigger.data.sha, message: 'chore: remove temporary class alignment trigger' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
