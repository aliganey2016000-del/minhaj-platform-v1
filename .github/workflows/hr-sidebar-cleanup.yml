name: HR sidebar cleanup

on:
  push:
    branches:
      - fix/hr-sidebar-order

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip hr cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update HR navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/components/admin-sidebar.tsx')
          s = p.read_text()
          old = """  {\n    title: 'HR',\n    items: [\n      {\n        key: 'group:hr-management', label: 'HR Management', icon: UsersRound,\n        children: [\n          { path: '/admin/hr',          label: 'HR Dashboard',        icon: UserCog2 },\n          { path: '/admin/staff',       label: 'Staff Directory',     icon: UserRound },\n          { path: '/admin/hr/access',   label: 'Access & Permissions', icon: ShieldCheck },\n        ],\n      },\n    ],\n  },"""
          new = """  {\n    title: 'HR Management',\n    items: [\n      { path: '/admin/staff',     label: 'Staff Directory',     icon: UserRound },\n      { path: '/admin/hr/access', label: 'Access & Permissions', icon: ShieldCheck },\n    ],\n  },"""
          if old not in s:
              raise SystemExit('Expected HR navigation block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Remove temporary workflow
        run: rm -f .github/workflows/hr-sidebar-cleanup.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/frontend/src/features/admin/components/admin-sidebar.tsx .github/workflows/hr-sidebar-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(admin): simplify HR sidebar navigation [skip hr cleanup]'
          git push
