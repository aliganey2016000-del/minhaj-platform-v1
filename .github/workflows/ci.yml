name: SAHAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep CI attached to every main-branch push so dashboard changes get a fresh run.

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Class Schedule & Timetable A-Z QA
        run: npm run test:schedule-qa

      - name: Class Schedule edge-case regressions
        run: npx ts-node src/__tests__/class-schedule-edge-cases.e2e.ts

      - name: Attendance lock audit regression
        run: npx ts-node src/__tests__/attendance-lock-audit.e2e.ts

      - name: Class-based attendance requires a schedule regression
        run: npx ts-node src/__tests__/class-based-attendance-requires-schedule.e2e.ts

      - name: Forum newest-messages and course list limit regression
        run: npx ts-node src/__tests__/forum-latest-messages-and-course-limits.e2e.ts

      - name: Staff escalation, certificate scope and exam deadline security regression
        run: npx ts-node src/__tests__/staff-escalation-certificates-exam-deadline.e2e.ts

      - name: Tenant isolation phase 2 regression (staff, content, resources, login domain, pending students, catalog)
        run: npx ts-node src/__tests__/tenant-isolation-phase2.e2e.ts

      - name: Upload safety regression (file types, private documents, traversal, headers)
        run: npx ts-node src/__tests__/upload-safety.e2e.ts

      - name: Ops hardening regression (Telegram webhook, per-account rate limit, TTL, live token checks, deploy scripts)
        run: npx ts-node src/__tests__/ops-hardening-phase4.e2e.ts

      - name: Tenant isolation phase 3 regression (system admin-only, content/grading/schools/staff/notifications/attendance scoping)
        run: npx ts-node src/__tests__/tenant-isolation-phase3.e2e.ts

      - name: Security hardening phase 5 regression (trusted-proxy tenant host, login lockout, refresh rotation, jwt algorithm pinning)
        run: npx ts-node src/__tests__/security-hardening-phase5.e2e.ts

      - name: Exam and finance integrity regression (answer leaks, review gating, result validation, id sequences, billing)
        run: npx ts-node src/__tests__/exam-finance-integrity.e2e.ts

      - name: Reliability phase 5 regression (boot hardening, health check, TTL retention, balance pagination, host caching)
        run: npx ts-node src/__tests__/reliability-phase5.e2e.ts

      - name: Phase 6 regression (scheduler race-safety, auth-state/socket invalidation wiring)
        run: npx ts-node src/__tests__/scheduler-socket-pwa-phase6.e2e.ts

      - name: Attendance notification duplicate-send race regression
        run: npx ts-node src/__tests__/attendance-notification-race.e2e.ts

      - name: Smart staff attendance profiles and settings regression
        run: npx ts-node --files src/__tests__/staff-attendance-profiles.e2e.ts

      - name: Teacher biometric encryption key rotation regression
        run: npx ts-node --files src/__tests__/teacher-biometric-key-rotation.regression.ts

      - name: Smart teacher attendance end-to-end regression
        run: npx ts-node --files src/__tests__/teacher-smart-attendance-flow.e2e.ts

      - name: Teacher smart attendance workflow regressions
        run: npx ts-node --files src/__tests__/teacher-smart-attendance.e2e.ts


      - name: Promotion tests
        run: npm run test:promotion

      - name: Teacher promotion tests
        run: npm run test:teacher-promotion

      - name: Corrupt student date repair tests
        run: npm run test:student-corrupt-dates

      - name: Dashboard tenant aggregation tests
        run: npm run test:dashboard-aggregations

      - name: Cloudflare client IP resolution tests
        run: npm run test:cloudflare-client-ip

      - name: Manage list search/pagination tests
        run: npm run test:list-search

      - name: Manage list search/pagination tests (batch 2)
        run: npm run test:list-search-2

      - name: User search-by-name tests
        run: npm run test:user-search

      - name: Dashboard micro-cache tests
        run: npm run test:dashboard-cache

      - name: Teacher CRUD & import tests
        run: npm run test:teacher-crud

      - name: Gate report tests
        run: npm run test:gate-report

      - name: Financial core payment tests
        run: npm run test:financial-core

      - name: Payment/invoice date school-timezone boundary regression
        run: npm run test:payment-date-timezone-boundary

      - name: Parent portal privacy and authorization tests
        run: npm run test:parent-portal

      - name: Tenant data integrity tests
        run: npm run test:tenant-data-integrity

      - name: Wildcard tenant routing regression
        run: npx ts-node --files src/__tests__/tenant-wildcard-routing.e2e.ts

      - name: Organization custom domain clearing regression
        run: npx ts-node --files src/__tests__/school-custom-domain-clear.e2e.ts

      - name: User Management orphan cleanup tests
        run: npm run test:user-orphan-cleanup

      - name: Student activity time-tracking tests
        run: npm run test:activity-tracking

      - name: Student performance flow regression
        run: npm run test:student-performance

      - name: Student historical performance regression
        run: npm run test:student-performance-history

      - name: Admin and teacher performance regression
        run: npx ts-node src/__tests__/staff-performance.e2e.ts

      - name: Dependency supply-chain regression (exceljs/uuid override)
        run: npx ts-node src/__tests__/dependency-supply-chain.e2e.ts

      - name: Backup/restore regression (scripts/backup.ts packaging, encryption, and dump-dir resolution)
        run: npx ts-node src/__tests__/backup-restore.e2e.ts

      - name: Exam room capacity shrink regression (room edit/import vs seated students)
        run: npm run test:exam-room-capacity-shrink

      - name: Password-reset token race regression (concurrent reset-password completions)
        run: npm run test:password-reset-race

      - name: Finance payment-status race and upload-cleanup regression
        run: npx ts-node src/__tests__/finance-upload-round4.e2e.ts

      - name: AI routes rate-limit coverage
        run: npm run test:ai-rate-limit

      - name: Gamification integrity regression (quiz-attempt race, lesson-XP replay, XP-injection endpoint removal)
        run: npm run test:gamification-integrity

      - name: CSV export formula-injection regression
        run: npm run test:csv-injection

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # npm 11.14+ has a regression that can reject valid lockfiles during npm ci.
      # Pin the known-good npm 11.13.0 client until that regression is resolved.
      - name: Use known-good npm
        run: npx --yes npm@11.13.0 --version

      # Keep frontend installation deterministic from package-lock.json.
      - name: Install dependencies
        run: npx --yes npm@11.13.0 ci

      - name: Attendance GPS regressions
        run: node scripts/test-attendance-location.mjs && node scripts/test-attendance-settings.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
