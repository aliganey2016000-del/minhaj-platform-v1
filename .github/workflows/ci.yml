name: SAHAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: TypeScript build
        run: npx tsc

      - name: Promotion tests
        run: npm run test:promotion

      - name: Teacher promotion tests
        run: npm run test:teacher-promotion

      - name: Gate report tests
        run: npm run test:gate-report

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # Pin the npm client used for deterministic lockfile installation.
      - name: Install dependencies
        run: npx --yes npm@11.13.0 ci

      - name: Dependency audit
        run: npx --yes npm@11.13.0 audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
