name: SAHAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep CI attached to every main-branch push so dashboard changes get a fresh run.

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npx tsc

      - name: Promotion tests
        run: npm run test:promotion

      - name: Teacher promotion tests
        run: npm run test:teacher-promotion

      - name: Gate report tests
        run: npm run test:gate-report

      - name: Financial core payment tests
        run: npm run test:financial-core

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch Record Payment balance refresh
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/payments-record.tsx')
          s = p.read_text()
          if 'const [balanceLoading, setBalanceLoading]' in s:
              raise SystemExit('record payment balance refresh already patched')
          old = """  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;
  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);
"""
          new = """  const [balanceLoading, setBalanceLoading] = useState(false);
  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;
  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);

  useEffect(() => {
    if (!selectedStudent?._id) return;
    let cancelled = false;
    setBalanceLoading(true);
    api.get('/payments/student-balances', { params: { search: selectedStudent.studentId } })
      .then(({ data }) => {
        const match = (data.data?.students || []).find((s: StudentBrief) => s._id === selectedStudent._id);
        if (!cancelled && match) {
          setSelectedStudent(prev => prev ? {
            ...prev,
            totalFees: Number(match.totalFees ?? 0),
            totalFeesPaid: Number(match.totalFeesPaid ?? 0),
            totalFeesDue: Number(match.totalFeesDue ?? 0),
            discount: Number(match.discount ?? 0),
          } : prev);
        }
      })
      .catch(() => { /* Keep identity data if balance refresh fails. */ })
      .finally(() => { if (!cancelled) setBalanceLoading(false); });
    return () => { cancelled = true; };
  }, [selectedStudent?._id, selectedStudent?.studentId]);
"""
          if old not in s:
              raise SystemExit('expected balance marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/frontend/src/features/admin/pages/payments-record.tsx
          git commit -m "fix(finance): refresh record payment balance from invoices"
          git push

      # npm 11.14+ has a regression that can reject valid lockfiles during npm ci.
      # Pin the known-good npm 11.13.0 client until that regression is resolved.
      - name: Use known-good npm
        run: npx --yes npm@11.13.0 --version

      # Keep frontend installation deterministic from package-lock.json.
      - name: Install dependencies
        run: npx --yes npm@11.13.0 ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
