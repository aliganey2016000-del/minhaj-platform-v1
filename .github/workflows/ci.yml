name: SAHAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit failed to produce a usable result (exit $audit_status)."
            cat audit.json
            exit "$audit_status"
          fi
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const allowed = new Set(['xlsx']);
          const blocking = Object.entries(report.vulnerabilities || {})
            .filter(([name, item]) => ['high', 'critical'].includes(item.severity) && !allowed.has(name));
          const allowedFindings = Object.entries(report.vulnerabilities || {})
            .filter(([name, item]) => ['high', 'critical'].includes(item.severity) && allowed.has(name));
          for (const [name] of allowedFindings) {
            console.warn(`::warning::Known high/critical vulnerability in ${name}: no npm fix is currently available. Track replacement of this dependency.`);
          }
          if (blocking.length) {
            console.error('Blocking high/critical dependency vulnerabilities:');
            for (const [name, item] of blocking) {
              console.error(`- ${name}: ${item.severity}`);
            }
            process.exit(1);
          }
          NODE

      - name: TypeScript build
        run: npx tsc

      - name: Promotion tests
        run: npm run test:promotion

      - name: Teacher promotion tests
        run: npm run test:teacher-promotion

      - name: Gate report tests
        run: npm run test:gate-report

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # Pin the npm client used for deterministic lockfile installation.
      - name: Install dependencies
        run: npx --yes npm@11.13.0 ci

      # The deployed frontend is static; Node/Vite/build-time dependencies are dev-only.
      - name: Production dependency audit
        run: npx --yes npm@11.13.0 audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
