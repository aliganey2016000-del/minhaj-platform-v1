name: Tmp Patch Payment Loading
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/record-payment-balance-sync-v6
          fetch-depth: 0
      - name: Fix loading indicator JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/payments-record.tsx')
          s = p.read_text()
          old = '''              {selectedStudent && (\n                {balanceLoading && (\n                  <div className="col-span-2 sm:col-span-4 text-center text-[11px] text-[var(--color-text-tertiary)]">Refreshing invoice balance…</div>\n                )}\n                <div className="mt-3 grid grid-cols-2 gap-2 text-xs sm:grid-cols-4">\n'''
          new = '''              {selectedStudent && (\n                <div className="mt-3">\n                  {balanceLoading && (\n                    <div className="mb-2 text-center text-[11px] text-[var(--color-text-tertiary)]">Refreshing invoice balance…</div>\n                  )}\n                  <div className="grid grid-cols-2 gap-2 text-xs sm:grid-cols-4">\n'''
          if old not in s:
              raise SystemExit('invalid loading JSX block not found')
          s = s.replace(old, new, 1)
          closing = '''                </div>\n              )}\n            </div>\n\n            <div>\n'''
          replacement = '''                  </div>\n                </div>\n              )}\n            </div>\n\n            <div>\n'''
          if closing not in s:
              raise SystemExit('balance card closing marker not found')
          s = s.replace(closing, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/frontend/src/features/admin/pages/payments-record.tsx
          git commit -m "fix(finance): correct payment balance loading JSX"
          git push origin HEAD:fix/record-payment-balance-sync-v6
