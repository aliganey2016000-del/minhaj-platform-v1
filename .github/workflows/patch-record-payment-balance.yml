name: Patch Record Payment Balance
on:
  push:
    branches:
      - fix/record-payment-balance-sync-v5-run4
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/payments-record.tsx')
          s = p.read_text()
          old = """  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;\n  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);\n"""
          new = """  const [balanceLoading, setBalanceLoading] = useState(false);\n  const selectedFeeSummary = getStudentFeeSummary(selectedStudent);\n  const isValid = !!selectedStudent && !!recordAmount && Number(recordAmount) > 0;\n\n  useEffect(() => {\n    if (!selectedStudent?._id) return;\n    let cancelled = false;\n    setBalanceLoading(true);\n    api.get('/payments/student-balances', { params: { search: selectedStudent.studentId } })\n      .then(({ data }) => {\n        const match = (data.data?.students || []).find((s: StudentBrief) => s._id === selectedStudent._id);\n        if (!cancelled && match) {\n          setSelectedStudent(prev => prev ? {\n            ...prev,\n            totalFees: Number(match.totalFees ?? 0),\n            totalFeesPaid: Number(match.totalFeesPaid ?? 0),\n            totalFeesDue: Number(match.totalFeesDue ?? 0),\n            discount: Number(match.discount ?? 0),\n          } : prev);\n        }\n      })\n      .catch(() => { /* Keep identity data if balance refresh fails. */ })\n      .finally(() => { if (!cancelled) setBalanceLoading(false); });\n    return () => { cancelled = true; };\n  }, [selectedStudent?._id, selectedStudent?.studentId]);\n"""
          if old not in s:
              raise SystemExit('expected balance marker not found')
          s = s.replace(old, new, 1)
          old2 = """              {selectedStudent && (\n                <div className=\"mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs\">\n"""
          new2 = """              {selectedStudent && (\n                <div className=\"mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs\">\n"""
          if old2 not in s:
              raise SystemExit('expected summary marker not found')
          s = s.replace(old2, new2, 1)
          marker = """                  <div className=\"rounded-lg bg-[var(--color-surface-secondary)] p-2 text-center\">\n                    <p className=\"text-[var(--color-text-tertiary)]\">Total Fees</p>\n"""
          replacement = """                  {balanceLoading && (\n                    <div className=\"col-span-2 sm:col-span-4 text-center text-[11px] text-[var(--color-text-tertiary)]\">Refreshing invoice balance…</div>\n                  )}\n                  <div className=\"rounded-lg bg-[var(--color-surface-secondary)] p-2 text-center\">\n                    <p className=\"text-[var(--color-text-tertiary)]\">Total Fees</p>\n"""
          if marker not in s:
              raise SystemExit('expected total-fees marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit patched frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/frontend/src/features/admin/pages/payments-record.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(finance): refresh record payment balance from invoices"
          git push
