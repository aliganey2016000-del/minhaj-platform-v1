name: Fix import header JSX

on:
  push:
    branches: [fix/restore-import-modals-teacher-class-course]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/restore-import-modals-teacher-class-course
      - name: Fix JSX props
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in [
            'apps/frontend/src/features/admin/pages/teachers-manage.tsx',
            'apps/frontend/src/features/admin/pages/classes-manage.tsx',
            'apps/frontend/src/features/admin/pages/courses-manage.tsx',
          ]:
              p = Path(path)
              text = p.read_text()
              text = re.sub(r'headers=(\[[^\n]+\])', r'headers={\1}', text)
              p.write_text(text)
          PY
          rm -f .github/workflows/fix-import-header-jsx.yml .github/trigger-import-header-jsx.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): correct import header JSX props"
          git push origin fix/restore-import-modals-teacher-class-course
