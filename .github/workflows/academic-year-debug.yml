name: Academic Year Debug
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          echo '--- academic year migration retrigger ---'
          echo '--- classes ---'
          grep -n -C 2 'academicYear' apps/frontend/src/features/admin/pages/classes-manage.tsx || true
          echo '--- fee structures ---'
          grep -n -C 2 'academicYear' apps/frontend/src/features/admin/pages/fee-structures-manage.tsx || true
          echo '--- invoices ---'
          grep -n -C 2 'academicYear' apps/frontend/src/features/admin/pages/invoices-manage.tsx || true