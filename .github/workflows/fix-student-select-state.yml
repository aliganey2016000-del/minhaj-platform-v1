name: Fix Student Select All State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-student-select-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add selection state
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/frontend/src/features/admin/pages/students-manage.tsx')
          s = p.read_text()
          old = "  const [selected, setSelected] = useState<string[]>([]);\n  const [modal, setModal] = useState<{ open: boolean; student?: Student }>({ open: false });"
          new = "  const [selected, setSelected] = useState<string[]>([]);\n  const [selectingAll, setSelectingAll] = useState(false);\n  const [modal, setModal] = useState<{ open: boolean; student?: Student }>({ open: false });"
          if old not in s:
              raise SystemExit('Selection state insertion point not found; refusing unsafe edit.')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-student-select-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/pages/students-manage.tsx .github/workflows/fix-student-select-state.yml
          git commit -m "fix students select all state"
          git push origin HEAD:main
