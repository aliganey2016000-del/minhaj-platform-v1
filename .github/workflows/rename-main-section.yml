name: Rename sidebar section

on:
  push:
    branches:
      - chore/sidebar-institution-management

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Main section
        run: |
          sed -i "s/title: 'Main'/title: 'INSTITUTION MANAGEMENT'/" apps/frontend/src/features/admin/components/admin-sidebar.tsx
          sed -i "s/section: 'Main'/section: 'INSTITUTION MANAGEMENT'/g" apps/backend/src/utils/sidebar-items.ts
          rm .github/workflows/rename-main-section.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/components/admin-sidebar.tsx apps/backend/src/utils/sidebar-items.ts .github/workflows/rename-main-section.yml
          git commit -m "chore(nav): rename Main to Institution Management"
          git push
