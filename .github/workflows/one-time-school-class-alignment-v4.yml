name: One-time School Class Alignment v4

on:
  push:
    branches:
      - fix/manage-classes-school-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manage-classes-school-alignment
          fetch-depth: 0
      - name: Apply school alignment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fp = 'apps/frontend/src/features/admin/pages/classes-manage.tsx';
          const bp = 'apps/backend/src/controllers/class.controller.ts';
          let f = fs.readFileSync(fp, 'utf8');
          let b = fs.readFileSync(bp, 'utf8');

          const oldHeaders = 'headers={["Organization", "Faculty", "Department", "Program", "Batch Number", "Grade Level", "Academic Year", "Study Year", "Semester Number", "Semester In Year", "Final Grade (Yes/No)", "Entry Grade (Yes/No)", "Class Name", "Section", "Room", "Capacity", "Shift / Learning Mode", "Status"]}';
          const newHeaders = "headers={institutionType === 'school' ? [\"Batch Number\", \"Academic Year\", \"Grade Level\", \"Department\", \"Class Name\", \"Section\", \"Room\", \"Capacity\", \"Shift / Learning Mode\", \"Final Grade (Yes/No)\", \"Entry Grade (Yes/No)\"] : [\"Organization\", \"Faculty\", \"Department\", \"Program\", \"Batch Number\", \"Grade Level\", \"Academic Year\", \"Study Year\", \"Semester Number\", \"Semester In Year\", \"Final Grade (Yes/No)\", \"Entry Grade (Yes/No)\", \"Class Name\", \"Section\", \"Room\", \"Capacity\", \"Shift / Learning Mode\"]}";
          if (f.includes(oldHeaders)) f = f.replace(oldHeaders, newHeaders);

          f = f.replace('<table className="w-full text-left text-sm">', '<table className="w-full table-fixed text-left text-sm">');
          f = f.replace("<th className=\"px-4 py-3\">{higherEd?'Program / Cohort':isTrainingCenter?'Program':'Class'}</th>", "<th className=\"w-[22%] px-4 py-3\">{higherEd?'Program / Cohort':isTrainingCenter?'Program':'Class / Grade'}</th>");
          f = f.replace('<th className="px-4 py-3">Department</th>', '<th className="w-[18%] px-4 py-3">Department</th>');
          f = f.replace('<th className="px-4 py-3">Academic Year</th>', '<th className="w-[14%] px-4 py-3">Academic Year</th>');
          f = f.replace('<th className="px-4 py-3">Room</th>', '<th className="w-[17%] px-4 py-3">{institutionType === "school" ? "Room / Capacity" : "Room"}</th>');
          f = f.replace('<th className="px-4 py-3">Status</th>', '<th className="w-[9%] px-4 py-3">Status</th>');
          f = f.replace('<th className="px-4 py-3 text-right">Actions</th>', '<th className="w-[8%] px-4 py-3 text-right">Actions</th>');
          f = f.replace("{c.section ? `Section ${c.section}` : ''}{institutionType === 'school' && c.gradeLevel != null ? ` · Grade ${c.gradeLevel}` : ''}{isTrainingCenter && c.batch ? ` · Batch ${c.batch}` : ''}", "{institutionType === 'school' && c.batch ? `Batch ${c.batch}` : ''}{c.section ? `${institutionType === 'school' && c.batch ? ' · ' : ''}Section ${c.section}` : ''}{institutionType === 'school' && c.gradeLevel != null ? ` · Grade ${c.gradeLevel}` : ''}{isTrainingCenter && c.batch ? ` · Batch ${c.batch}` : ''}");
          f = f.replace('{c.room}{c.capacity ? <span className="block text-xs text-slate-400">Cap. {c.capacity}</span> : null}', '{c.room}{c.capacity ? <span className="block text-xs text-slate-400">Cap. {c.capacity}</span> : null}{institutionType === "school" && c.shiftMode ? <span className="block text-xs text-slate-400">{c.shiftMode}</span> : null}');
          f = f.replace('<td colSpan={8} className="px-4 py-10 text-center text-slate-500">Loading...</td>', '<td colSpan={higherEd ? 8 : 7} className="px-4 py-10 text-center text-slate-500">Loading...</td>');
          f = f.replace('<td colSpan={8} className="px-4 py-10 text-center text-slate-500">No classes found.</td>', '<td colSpan={higherEd ? 8 : 7} className="px-4 py-10 text-center text-slate-500">No classes found.</td>');

          const marker = "const CLASS_EXPORT_HEADERS = [\n  'Organization', 'Faculty', 'Department', 'Program',\n  'Batch Number', 'Grade Level', 'Academic Year', 'Study Year', 'Semester Number', 'Semester In Year',\n  'Final Grade (Yes/No)', 'Entry Grade (Yes/No)',\n  'Class Name', 'Section', 'Room', 'Capacity', 'Shift / Learning Mode',\n];";
          if (b.includes(marker) && !b.includes('const SCHOOL_CLASS_EXPORT_HEADERS')) {
            b = b.replace(marker, marker + "\n\nconst SCHOOL_CLASS_EXPORT_HEADERS = [\n  'Batch Number', 'Academic Year', 'Grade Level', 'Department', 'Class Name', 'Section',\n  'Room', 'Capacity', 'Shift / Learning Mode', 'Final Grade (Yes/No)', 'Entry Grade (Yes/No)',\n];");
          }

          const es = b.indexOf('export const exportClasses = async');
          const ee = b.indexOf('\n};\n\n// ---------------------------------------------------------------------------\n// GET /classes/template', es);
          if (es < 0 || ee < 0) throw new Error('backend export boundaries not found');
          if (!b.slice(es, ee).includes('const headers = institutionType ===')) {
            const lines = [
              "export const exportClasses = async (req: Request, res: Response): Promise<void> => {",
              "  const filter: Record<string, unknown> = applyOrgFilter(req, {}, 'school');",
              "  const orgId = resolveOrgIdForCreate(req);",
              "  const org = orgId ? await School.findById(orgId).select('institutionType organizationType').lean() : null;",
              "  const institutionType = org ? resolveInstitutionType(org) : 'school';",
              "  const classes = await ClassModel.find(filter)",
              "    .populate('school', 'name')",
              "    .populate({ path: 'department', select: 'name code facultyId', populate: { path: 'facultyId', select: 'name' } })",
              "    .populate('program', 'name')",
              "    .sort({ createdAt: -1 })",
              "    .lean();",
              "  const rows = classes.map((c: any) => {",
              "    const dept = typeof c.department === 'object' ? c.department : null;",
              "    if (institutionType === 'school') return [c.batch || '', c.academicYear || '', c.gradeLevel != null ? String(c.gradeLevel) : '', dept?.name || (typeof c.department === 'string' ? c.department : '') || '', c.title || '', c.section || '', c.room || '', c.capacity != null ? String(c.capacity) : '', c.shiftMode || 'Morning', c.isGraduatingGrade ? 'Yes' : 'No', c.isEntryGrade ? 'Yes' : 'No'];",
              "    return [c.school?.name || '', dept?.facultyId?.name || '', dept?.name || (typeof c.department === 'string' ? c.department : '') || '', c.program?.name || '', c.batch || '', c.gradeLevel != null ? String(c.gradeLevel) : '', c.academicYear || '', c.studyYear != null ? String(c.studyYear) : '', c.semesterNumber != null ? String(c.semesterNumber) : '', c.semesterInYear != null ? String(c.semesterInYear) : '', c.isGraduatingGrade ? 'Yes' : 'No', c.isEntryGrade ? 'Yes' : 'No', c.title || '', c.section || '', c.room || '', c.capacity != null ? String(c.capacity) : '', c.shiftMode || 'Morning'];",
              "  });",
              "  const headers = institutionType === 'school' ? SCHOOL_CLASS_EXPORT_HEADERS : CLASS_EXPORT_HEADERS;",
              "  const buffer = buildXlsxBuffer(headers, rows, 'Classes');",
              "  res.setHeader('Content-Type', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');",
              "  res.setHeader('Content-Disposition', `attachment; filename=classes-export-${new Date().toISOString().slice(0, 10)}.xlsx`);",
              "  res.end(buffer);",
              "}",
            ];
            b = b.slice(0, es) + lines.join('\n') + b.slice(ee + 3);
          }

          const oldRow = "  school: ['', '', 'Primary', '', '10026', '3', '2026-2027', '', '', '', 'No', 'No', 'Grade 3', 'A', 'Room 5', '35', 'Morning'],";
          if (b.includes(oldRow)) b = b.replace(oldRow, "  school: ['10026', '2026-2027', '3', 'Primary', 'Grade 3', 'A', 'Room 5', '35', 'Morning', 'No', 'No'],");
          const oldBuild = "  const rows = [TEMPLATE_EXAMPLE_ROWS[institutionType] || TEMPLATE_EXAMPLE_ROWS.school];\n  const buffer = buildXlsxBuffer(CLASS_EXPORT_HEADERS, rows, 'Class Template');";
          if (b.includes(oldBuild)) b = b.replace(oldBuild, "  const rows = [TEMPLATE_EXAMPLE_ROWS[institutionType] || TEMPLATE_EXAMPLE_ROWS.school];\n  const headers = institutionType === 'school' ? SCHOOL_CLASS_EXPORT_HEADERS : CLASS_EXPORT_HEADERS;\n  const buffer = buildXlsxBuffer(headers, rows, 'Class Template');");

          fs.writeFileSync(fp, f);
          fs.writeFileSync(bp, b);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/features/admin/pages/classes-manage.tsx apps/backend/src/controllers/class.controller.ts
          git rm -f .github/workflows/one-time-school-class-alignment.yml .github/workflows/one-time-school-class-alignment-v2.yml .github/workflows/one-time-school-class-alignment-v3.yml .github/workflows/one-time-school-class-alignment-v4.yml || true
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "fix(classes): align school class workflow"
          git push origin HEAD:fix/manage-classes-school-alignment
