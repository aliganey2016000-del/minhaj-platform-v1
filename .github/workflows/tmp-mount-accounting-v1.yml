name: Tmp Mount Accounting V1
on:
  push:
    branches: [feature/accounting-ledger-foundation-v1]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch accounting route mount
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/src/routes/v1/index.ts')
          s = p.read_text()
          if "import accountingRoutes from './accounting.routes';" not in s:
              marker = "import cashSessionRoutes from './cash-session.routes';"
              if marker not in s:
                  raise SystemExit('cash session import marker not found')
              s = s.replace(marker, marker + "\nimport accountingRoutes from './accounting.routes';", 1)
          if "router.use('/finance', accountingRoutes);" not in s:
              marker = "router.use('/cash-sessions', cashSessionRoutes);"
              if marker not in s:
                  raise SystemExit('cash session route marker not found')
              s = s.replace(marker, marker + "\nrouter.use('/finance', accountingRoutes);", 1)
          p.write_text(s)

          p = Path('apps/backend/src/routes/v1/accounting.routes.ts')
          s = p.read_text()
          s = s.replace("\nauthMiddleware;", "")
          p.write_text(s)
          PY
      - name: Commit mount
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/backend/src/routes/v1/index.ts apps/backend/src/routes/v1/accounting.routes.ts
          git diff --cached --quiet || git commit -m "feat(finance): mount accounting routes"
          git push
